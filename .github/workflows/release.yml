name: release

on:
  push:
    # run only against tags
    tags:
      - "v*.*.*"

permissions:
  contents: write
  # packages: write
  # issues: write

jobs:
  goreleaser:
    runs-on: ubuntu-latest
    outputs:
      signed: ${{ steps.apple.outputs.signed }}
    steps:
      # The darwin binaries are signed and notarized only when every Apple
      # secret is set (see CONTRIBUTING). A fork without them publishes
      # unsigned binaries; this repository refuses to.
      - name: Check the Apple signing secrets
        id: apple
        env:
          MACOS_SIGN_P12: ${{ secrets.MACOS_SIGN_P12 }}
          MACOS_SIGN_PASSWORD: ${{ secrets.MACOS_SIGN_PASSWORD }}
          MACOS_NOTARY_ISSUER_ID: ${{ secrets.MACOS_NOTARY_ISSUER_ID }}
          MACOS_NOTARY_KEY_ID: ${{ secrets.MACOS_NOTARY_KEY_ID }}
          MACOS_NOTARY_KEY: ${{ secrets.MACOS_NOTARY_KEY }}
        run: |
          missing=""
          some=""
          for name in MACOS_SIGN_P12 MACOS_SIGN_PASSWORD MACOS_NOTARY_ISSUER_ID MACOS_NOTARY_KEY_ID MACOS_NOTARY_KEY; do
            if [ -z "$(printenv "$name")" ]; then missing="$missing $name"; else some=1; fi
          done
          if [ -z "$missing" ]; then
            echo "signed=true" >>"$GITHUB_OUTPUT"
          elif [ "$GITHUB_REPOSITORY" = asakin/agent-pane ] || [ -n "$some" ]; then
            echo "::error::missing Apple signing secrets:$missing"
            exit 1
          else
            echo "::warning::no Apple signing secrets: the darwin binaries will not be signed or notarized"
            echo "signed=false" >>"$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - run: git fetch --force --tags
      - uses: actions/setup-node@v7
        with:
          node-version: "26"
          cache: "npm"
          cache-dependency-path: "extension/package-lock.json"
      - name: Set manifest version
        run: echo "MANIFEST_VERSION=$(git describe --tags --abbrev=0 | sed 's/^v//')" >> "$GITHUB_ENV"
      - name: Build extension
        run: npm ci && npm run build
        working-directory: extension
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
      # The published install.sh installs this tag and nothing else.
      - name: Stamp install.sh with this release
        run: |
          mkdir -p .release
          sed "s/^VERSION=\"\"\$/VERSION=\"${GITHUB_REF_NAME}\"/" install.sh >.release/install.sh
          grep -qx "VERSION=\"${GITHUB_REF_NAME}\"" .release/install.sh
      - uses: goreleaser/goreleaser-action@v7
        with:
          distribution: goreleaser
          version: "~> v2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # .goreleaser.yaml signs and notarizes when MACOS_SIGN_P12 is set.
          MACOS_SIGN_P12: ${{ secrets.MACOS_SIGN_P12 }}
          MACOS_SIGN_PASSWORD: ${{ secrets.MACOS_SIGN_PASSWORD }}
          MACOS_NOTARY_ISSUER_ID: ${{ secrets.MACOS_NOTARY_ISSUER_ID }}
          MACOS_NOTARY_KEY_ID: ${{ secrets.MACOS_NOTARY_KEY_ID }}
          MACOS_NOTARY_KEY: ${{ secrets.MACOS_NOTARY_KEY }}

  # Install the published release the way a person does, and check it.
  verify:
    needs: goreleaser
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Create a browser config folder
        run: |
          if [ "$(uname -s)" = Darwin ]; then
            mkdir -p "$HOME/Library/Application Support/Google/Chrome"
          else
            mkdir -p "$HOME/.config/google-chrome"
          fi
      - name: Install with the published install.sh
        run: curl -fsSL "https://github.com/${GITHUB_REPOSITORY}/releases/download/${GITHUB_REF_NAME}/install.sh" | sh
      - name: Run it again and check nothing changes
        run: |
          curl -fsSL "https://github.com/${GITHUB_REPOSITORY}/releases/download/${GITHUB_REF_NAME}/install.sh" | sh >second.out
          if grep '^agent-pane: updated' second.out; then exit 1; fi
      - name: Check the installed version
        run: |
          "$HOME/.local/bin/agent-pane" doctor
          "$HOME/.local/bin/agent-pane" --version | grep -F "${GITHUB_REF_NAME#v}"
      # Gatekeeper accepts the installed binary as notarized Developer ID
      # software. Skipped only for a fork that released without the secrets.
      - name: Check the binary is signed and notarized
        if: runner.os == 'macOS' && needs.goreleaser.outputs.signed == 'true'
        run: |
          bin="$HOME/.local/bin/agent-pane"
          codesign --verify --strict --verbose=2 "$bin"
          codesign --display --verbose=4 "$bin" 2>&1 | tee codesign.out
          grep -q '^Authority=Developer ID Application: ' codesign.out
          spctl --assess --type install --verbose=4 "$bin" 2>&1 | tee spctl.out
          grep -q 'source=Notarized Developer ID' spctl.out
