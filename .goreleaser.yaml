# Make sure to check the documentation at https://goreleaser.com
version: 2
before:
  hooks:
    - go mod tidy
    - rm -rf completions
    - mkdir completions
    - sh -c 'go run . completion "bash" >./completions/agent-pane.bash'
    - sh -c 'go run . completion "zsh" >./completions/agent-pane.zsh'
    - sh -c 'go run . completion "fish" >./completions/agent-pane.fish'
    # The pinned herdr-core build for each archive (scripts/herdr-core.lock).
    - sh -c 'for p in darwin_amd64 darwin_arm64 linux_amd64 linux_arm64 windows_amd64; do sh scripts/fetch-herdr-core.sh "$p" ".release/herdr-core/$p" || exit 1; done'
changelog:
  disable: true
builds:
  - id: unix
    binary: agent-pane
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
    # The platforms herdr-core is built for, and install.sh installs.
    goarch:
      - amd64
      - arm64
  # The platform install.ps1 installs (rfcs/0002-windows-support.md).
  - id: windows
    binary: agent-pane
    env:
      - CGO_ENABLED=0
    goos:
      - windows
    goarch:
      - amd64
# Sign the darwin binaries with a Developer ID certificate and notarize them,
# when release.yml passes the Apple credentials. Without them (a fork, or a
# local snapshot) the binaries are built unsigned. The release workflow
# refuses to publish unsigned binaries from the upstream repository.
notarize:
  macos:
    - enabled: '{{ isEnvSet "MACOS_SIGN_P12" }}'
      sign:
        certificate: "{{.Env.MACOS_SIGN_P12}}"
        password: "{{.Env.MACOS_SIGN_PASSWORD}}"
      notarize:
        issuer_id: "{{.Env.MACOS_NOTARY_ISSUER_ID}}"
        key_id: "{{.Env.MACOS_NOTARY_KEY_ID}}"
        key: "{{.Env.MACOS_NOTARY_KEY}}"
        # Wait for Apple's verdict so a rejected binary fails the release.
        wait: true
        timeout: 20m
archives:
  - id: unix
    ids: [unix]
    name_template: "agent-pane-{{ .Version }}-{{ .Os }}_{{ .Arch }}"
    files:
      - README.md
      - LICENSE
      - completions/*
      - src: extension/dist/chrome-mv3/*
        dst: extensions/chrome
      # The rest of the layout scripts/place.sh installs from.
      - agents
      - skills/agent-pane
      - src: scripts/place.sh
        dst: .
        strip_parent: true
      - src: scripts/instructions.md
        dst: .
        strip_parent: true
      # The private herdr-core and its license and notices.
      - src: ".release/herdr-core/{{ .Os }}_{{ .Arch }}/libexec/hc"
        dst: libexec
        strip_parent: true
      - src: ".release/herdr-core/{{ .Os }}_{{ .Arch }}/herdr-core.lock"
        dst: .
        strip_parent: true
      - src: ".release/herdr-core/{{ .Os }}_{{ .Arch }}/licenses/herdr-core/*"
        dst: licenses/herdr-core
        strip_parent: true
  # The Windows archive: no place.sh (`agent-pane.exe place` lays it out) and
  # no shell completions. The core is a folder (hc.exe and its ConPTY files)
  # and its notices are a folder, so their paths are kept below libexec/ and
  # licenses/herdr-core/.
  - id: windows
    ids: [windows]
    name_template: "agent-pane-{{ .Version }}-{{ .Os }}_{{ .Arch }}"
    format_overrides:
      - goos: windows
        formats: ["zip"]
    files:
      - README.md
      - LICENSE
      - src: extension/dist/chrome-mv3/*
        dst: extensions/chrome
      - agents
      - skills/agent-pane
      - src: scripts/instructions.md
        dst: .
        strip_parent: true
      - src: ".release/herdr-core/{{ .Os }}_{{ .Arch }}/libexec/*"
        dst: libexec
      - src: ".release/herdr-core/{{ .Os }}_{{ .Arch }}/herdr-core.lock"
        dst: .
        strip_parent: true
      - src: ".release/herdr-core/{{ .Os }}_{{ .Arch }}/licenses/herdr-core/*"
        dst: licenses/herdr-core
release:
  prerelease: auto
  # install.sh and install.ps1 with VERSION set to this tag, written by
  # release.yml.
  extra_files:
    - glob: ./.release/install.sh
    - glob: ./.release/install.ps1
checksum:
  name_template: "checksums.txt"
  extra_files:
    - glob: ./.release/install.sh
    - glob: ./.release/install.ps1
snapshot:
  version_template: "{{ incpatch .Version }}-next"
