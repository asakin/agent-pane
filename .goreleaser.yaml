# Make sure to check the documentation at https://goreleaser.com
version: 2
before:
  hooks:
    - go mod tidy
    - rm -rf completions
    - mkdir completions
    - sh -c 'go run . completion "bash" >./completions/agent-pane.bash'
    - sh -c 'go run . completion "zsh" >./completions/agent-pane.zsh'
    - sh -c 'go run . completion "fish" >./completions/agent-pane.fish'
changelog:
  disable: true
builds:
  - binary: agent-pane
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
archives:
  - name_template: "agent-pane-{{ .Version }}-{{ .Os }}_{{ .Arch }}"
    format_overrides:
      - goos: windows
        formats: ["zip"]
    files:
      - README.md
      - LICENSE
      - completions/*
      - src: extension/dist/chrome-mv3/*
        dst: extensions/chrome
      # The rest of the layout scripts/place.sh installs from.
      - agents
      - skills/agent-pane
      - src: scripts/place.sh
        dst: .
        strip_parent: true
release:
  prerelease: auto
  # install.sh with VERSION set to this tag, written by release.yml.
  extra_files:
    - glob: ./.release/install.sh
checksum:
  name_template: "checksums.txt"
  extra_files:
    - glob: ./.release/install.sh
snapshot:
  version_template: "{{ incpatch .Version }}-next"
