# Make sure to check the documentation at https://goreleaser.com
version: 2
before:
  hooks:
    - go mod tidy
    - rm -rf completions
    - mkdir completions
    - sh -c 'go run . completion "bash" >./completions/agent-pane.bash'
    - sh -c 'go run . completion "zsh" >./completions/agent-pane.zsh'
    - sh -c 'go run . completion "fish" >./completions/agent-pane.fish'
changelog:
  disable: true
builds:
  - binary: agent-pane
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
# Sign the darwin binaries with a Developer ID certificate and notarize them,
# when release.yml passes the Apple credentials. Without them (a fork, or a
# local snapshot) the binaries are built unsigned. The release workflow
# refuses to publish unsigned binaries from the upstream repository.
notarize:
  macos:
    - enabled: '{{ isEnvSet "MACOS_SIGN_P12" }}'
      sign:
        certificate: "{{.Env.MACOS_SIGN_P12}}"
        password: "{{.Env.MACOS_SIGN_PASSWORD}}"
      notarize:
        issuer_id: "{{.Env.MACOS_NOTARY_ISSUER_ID}}"
        key_id: "{{.Env.MACOS_NOTARY_KEY_ID}}"
        key: "{{.Env.MACOS_NOTARY_KEY}}"
        # Wait for Apple's verdict so a rejected binary fails the release.
        wait: true
        timeout: 20m
archives:
  - name_template: "agent-pane-{{ .Version }}-{{ .Os }}_{{ .Arch }}"
    format_overrides:
      - goos: windows
        formats: ["zip"]
    files:
      - README.md
      - LICENSE
      - completions/*
      - src: extension/dist/chrome-mv3/*
        dst: extensions/chrome
      # The rest of the layout scripts/place.sh installs from.
      - agents
      - skills/agent-pane
      - src: scripts/place.sh
        dst: .
        strip_parent: true
      - src: scripts/instructions.md
        dst: .
        strip_parent: true
release:
  prerelease: auto
  # install.sh with VERSION set to this tag, written by release.yml.
  extra_files:
    - glob: ./.release/install.sh
checksum:
  name_template: "checksums.txt"
  extra_files:
    - glob: ./.release/install.sh
snapshot:
  version_template: "{{ incpatch .Version }}-next"
